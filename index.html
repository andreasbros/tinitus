<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tinnitus App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Single-theme neon design: the page commits to a dark stage in every viewer theme. */
  :root {
    color-scheme: dark;
    --void: #07080f;
    --stage: #0d0f1c;
    --glass: rgba(20, 23, 44, 0.66);
    --glass-line: rgba(140, 150, 255, 0.16);
    --ink: #eef0ff;
    --muted: #8b90b3;
    --cyan: #22e6ff;
    --cyan-glow: rgba(34, 230, 255, 0.45);
    --magenta: #ff3ddb;
    --magenta-glow: rgba(255, 61, 219, 0.45);
    --violet: #8a5cff;
    --track: rgba(255, 255, 255, 0.08);
    --font-display: "Unbounded", "Outfit", system-ui, sans-serif;
    --font-body: "Outfit", "Segoe UI", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--void); }
  body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(138, 92, 255, 0.18), transparent 60%),
      radial-gradient(800px 500px at 100% 100%, rgba(34, 230, 255, 0.08), transparent 60%),
      var(--void);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: 28px 56px;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .app { max-width: 560px; margin: 0 auto; display: grid; gap: 22px; overflow: hidden; overflow: clip; }
  .fx { animation: rise 0.7s var(--ease) both; }
  .fx:nth-child(2) { animation-delay: 0.08s; }
  .fx:nth-child(3) { animation-delay: 0.16s; }
  .fx:nth-child(4) { animation-delay: 0.24s; }
  @keyframes rise { from { opacity: 0.35; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  header { text-align: center; display: grid; gap: 6px; }
  header h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; letter-spacing: 0.02em; margin: 0; text-wrap: balance; }
  header p { margin: 0; color: var(--muted); font-size: 0.98rem; max-width: 46ch; justify-self: center; }

  /* Orb stage */
  .stage { position: relative; display: grid; place-items: center; }
  .orb { position: relative; width: min(340px, 84vw); aspect-ratio: 1; max-width: 100%; }
  .orb canvas { position: absolute; inset: -30%; width: 160%; height: 160%; pointer-events: none; }
  .readout {
    position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px; pointer-events: none;
  }
  .hz {
    font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums;
    font-size: clamp(2.1rem, 9vw, 3rem); line-height: 1; letter-spacing: -0.01em;
    text-shadow: 0 0 24px rgba(255, 255, 255, 0.35);
    transition: transform 0.18s var(--spring);
  }
  .hz.bump { transform: scale(1.06); }
  .hz small { display: block; font-family: var(--font-mono); font-weight: 400; font-size: 0.85rem; color: var(--muted); letter-spacing: 0.2em; margin-top: 8px; }
  .note { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
  .state {
    position: absolute; top: 4%; left: 50%; transform: translateX(-50%);
    font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted);
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .state i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .state.on { color: var(--cyan); }
  .state.on i { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }

  /* Glass panel */
  .panel {
    background: var(--glass); border: 1px solid var(--glass-line); border-radius: 22px;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    padding: 22px; display: grid; gap: 20px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }
  .lbl { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
  .lbl b { color: var(--ink); font-weight: 500; margin-left: 8px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

  /* Radix Slider */
  .SliderRoot { position: relative; display: flex; align-items: center; user-select: none; touch-action: none; width: 100%; height: 44px; }
  .SliderTrack { position: relative; flex-grow: 1; height: 6px; border-radius: 999px; background: var(--track); overflow: visible; }
  .SliderRange { position: absolute; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--magenta), var(--violet), var(--cyan)); box-shadow: 0 0 14px var(--cyan-glow); }
  .SliderThumb {
    display: block; width: 26px; height: 26px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 0 5px rgba(34, 230, 255, 0.18), 0 0 22px var(--cyan-glow);
    transition: transform 0.25s var(--spring), box-shadow 0.25s var(--ease);
    cursor: grab;
  }
  .SliderThumb:hover { transform: scale(1.12); }
  .SliderThumb:active { transform: scale(1.22); cursor: grabbing; box-shadow: 0 0 0 8px rgba(34, 230, 255, 0.22), 0 0 34px var(--cyan); }
  .SliderThumb:focus-visible { outline: none; box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.5), 0 0 26px var(--cyan); }
  .vol .SliderRange { background: linear-gradient(90deg, rgba(255,255,255,0.35), #fff); box-shadow: none; }
  .vol .SliderThumb { width: 20px; height: 20px; box-shadow: 0 0 0 4px rgba(255,255,255,0.14); }
  .ticks { position: relative; height: 16px; margin-top: -8px; font-family: var(--font-mono); font-size: 0.66rem; color: var(--muted); }
  .ticks span { position: absolute; transform: translateX(-50%); }
  .ticks span::before { content: ""; display: block; width: 1px; height: 4px; margin: 0 auto 2px; background: var(--glass-line); }
  .ticks span.edge { color: var(--cyan); }
  .ticks span.edge::before { background: var(--cyan); height: 6px; }
  .band { position: absolute; top: -3px; bottom: -3px; border-radius: 999px; background: rgba(34, 230, 255, 0.10); border: 1px solid rgba(34, 230, 255, 0.22); pointer-events: none; }
  .zones { display: flex; justify-content: space-between; gap: 8px; font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .zones .mid { color: var(--cyan); text-align: center; }
  @media (max-width: 440px) { .ticks span.opt { display: none; } }

  /* Chips */
  .chips { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .chip {
    font: 500 0.84rem var(--font-mono); padding: 10px 0; border-radius: 12px; color: var(--ink);
    background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-line); cursor: pointer;
    transition: transform 0.2s var(--spring), background 0.2s, border-color 0.2s, box-shadow 0.2s;
  }
  .chip:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(34, 230, 255, 0.4); }
  .chip:active { transform: scale(0.9); box-shadow: 0 0 18px var(--cyan-glow); }
  button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  /* Play */
  .play {
    position: relative; isolation: isolate; width: 100%; padding: 16px 20px; border: 0; border-radius: 16px; cursor: pointer;
    font: 600 1.05rem var(--font-body); letter-spacing: 0.01em; color: #06070f;
    background: linear-gradient(120deg, var(--cyan), #7df5ff);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 10px 30px rgba(34, 230, 255, 0.25);
    transition: transform 0.25s var(--spring), box-shadow 0.3s var(--ease), background 0.3s;
  }
  .play:hover { transform: translateY(-1px) scale(1.01); box-shadow: 0 14px 40px rgba(34, 230, 255, 0.4); }
  .play:active { transform: scale(0.97); }
  .play svg { width: 18px; height: 18px; fill: currentColor; }
  .play.on { background: linear-gradient(120deg, var(--magenta), #ff7be6); color: #fff; box-shadow: 0 10px 34px var(--magenta-glow); }
  @property --ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  .play.on::after {
    content: ""; position: absolute; inset: -3px; border-radius: 19px; z-index: -1;
    background: conic-gradient(from var(--ang), var(--magenta), var(--cyan), var(--violet), var(--magenta));
    filter: blur(10px); opacity: 0.7; animation: sweep 3s linear infinite;
  }
  @keyframes sweep { to { --ang: 360deg; } }

  /* Controls */
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 16px; }
  @media (max-width: 480px) { .controls { grid-template-columns: 1fr; } }
  .field { display: grid; gap: 8px; }
  .ToggleGroup { display: inline-flex; width: 100%; padding: 4px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-line); }
  .ToggleGroupItem {
    flex: 1; padding: 9px 4px; border: 0; border-radius: 9px; background: transparent; color: var(--muted);
    font: 600 0.86rem var(--font-body); cursor: pointer; transition: color 0.2s, background 0.25s var(--ease), transform 0.2s var(--spring);
  }
  .ToggleGroupItem:hover { color: var(--ink); }
  .ToggleGroupItem:active { transform: scale(0.95); }
  .ToggleGroupItem[data-state="on"] { color: #06070f; background: linear-gradient(120deg, var(--cyan), #7df5ff); box-shadow: 0 4px 16px var(--cyan-glow); }
  .SwitchRoot {
    width: 48px; height: 28px; border-radius: 999px; border: 1px solid var(--glass-line); background: rgba(255, 255, 255, 0.08);
    position: relative; cursor: pointer; padding: 0; transition: background 0.25s, box-shadow 0.25s;
  }
  .SwitchRoot[data-state="checked"] { background: linear-gradient(120deg, var(--magenta), var(--violet)); box-shadow: 0 0 16px var(--magenta-glow); }
  .SwitchThumb {
    display: block; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    transform: translateX(2px); transition: transform 0.3s var(--spring);
  }
  .SwitchThumb[data-state="checked"] { transform: translateX(22px); }
  .switchrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0 0; }
  .switchrow span { font-size: 0.95rem; }

  /* Lock in + matches */
  .lock {
    width: 100%; padding: 13px 18px; border-radius: 14px; cursor: pointer; font: 600 1rem var(--font-body);
    color: var(--ink); background: transparent; border: 1px solid rgba(255, 61, 219, 0.5);
    transition: transform 0.25s var(--spring), background 0.2s, box-shadow 0.3s;
  }
  .lock:hover { background: rgba(255, 61, 219, 0.12); box-shadow: 0 0 24px var(--magenta-glow); }
  .lock:active { transform: scale(0.96); }
  .lock:disabled { opacity: 0.45; cursor: default; box-shadow: none; background: transparent; }
  .matches { display: grid; gap: 8px; }
  .match {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 14px; border-radius: 12px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--glass-line);
    animation: pop 0.45s var(--spring) both;
  }
  @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }
  .match b { font-family: var(--font-display); font-weight: 500; font-size: 1rem; font-variant-numeric: tabular-nums; }
  .match small { color: var(--muted); font-family: var(--font-mono); font-size: 0.72rem; }
  .match .acts { display: flex; gap: 6px; }
  .mini {
    font: 500 0.78rem var(--font-body); padding: 6px 10px; border-radius: 8px; cursor: pointer;
    color: var(--ink); background: rgba(255, 255, 255, 0.07); border: 1px solid transparent; transition: transform 0.2s var(--spring), background 0.2s;
  }
  .mini:hover { background: rgba(34, 230, 255, 0.18); }
  .mini:active { transform: scale(0.92); }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    padding: 12px 18px; border-radius: 999px; background: rgba(20, 23, 44, 0.9); border: 1px solid rgba(255, 61, 219, 0.5);
    color: var(--ink); font-weight: 500; box-shadow: 0 0 30px var(--magenta-glow); backdrop-filter: blur(12px);
    animation: toast 2.6s var(--ease) both; white-space: nowrap; max-width: calc(100vw - 32px); z-index: 10;
  }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, 16px) scale(0.9); } 12%, 80% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -8px); } }

  .warn { margin: 0; font-size: 0.86rem; color: var(--muted); }
  .warn b { color: var(--ink); font-weight: 500; }
  .foot { font-size: 0.85rem; color: var(--muted); text-align: center; }
  .foot p { margin: 0 0 8px; }


  /* Orb as a button */
  .orb { cursor: pointer; border-radius: 50%; transition: transform 0.35s var(--spring); outline: none; }
  .orb:hover { transform: scale(1.03); }
  .orb:active { transform: scale(0.98); }
  .orb:focus-visible { box-shadow: 0 0 0 3px var(--cyan); }
  .hint { text-align: center; font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-top: -8px; }
  .wide { grid-column: 1 / -1; }
  .rate { display: grid; gap: 8px; }
  .rate-chips { display: flex; gap: 6px; }
  .rate-chips .chip { flex: 1; padding: 8px 0; }
  .ToggleGroupItem[data-disabled] { opacity: 0.3; cursor: not-allowed; }
  .ToggleGroup.five .ToggleGroupItem { padding-inline: 2px; font-size: 0.8rem; }
  .ghost {
    padding: 11px 16px; border-radius: 12px; cursor: pointer; font: 600 0.95rem var(--font-body); color: var(--ink);
    background: rgba(255, 255, 255, 0.06); border: 1px solid var(--glass-line); transition: transform 0.25s var(--spring), background 0.2s, box-shadow 0.3s;
  }
  .ghost:hover { background: rgba(138, 92, 255, 0.2); box-shadow: 0 0 22px rgba(138, 92, 255, 0.35); }
  .ghost:active { transform: scale(0.96); }

  /* Light room */
  .light { position: fixed; inset: 0; z-index: 50; background: #000; overflow: hidden; animation: fadein 0.5s var(--ease) both; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .light canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .light.hide { cursor: none; }
  .bar {
    position: absolute; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin: 0 auto;
    background: rgba(10, 12, 24, 0.72); border: 1px solid var(--glass-line); border-radius: 18px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    padding: 14px 16px; display: grid; gap: 10px; transition: opacity 0.3s var(--ease), transform 0.3s var(--ease);
  }
  .light.hide .bar { opacity: 0; transform: translateY(14px); pointer-events: none; }
  .bar .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .bar .acts { display: flex; gap: 8px; }
  .bar .hzmini { font-family: var(--font-display); font-weight: 500; font-size: 1rem; font-variant-numeric: tabular-nums; }
  .bar .hzmini small { font-family: var(--font-mono); font-weight: 400; font-size: 0.7rem; color: var(--muted); margin-left: 6px; letter-spacing: 0.15em; }
  .bar .play { padding: 10px 16px; font-size: 0.95rem; width: auto; border-radius: 12px; }
  .bar .play.on::after { display: none; }
  .tip { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); left: 0; right: 0; text-align: center; font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.55); transition: opacity 0.3s; }
  .light.hide .tip { opacity: 0; }

  /* Warning gate */
  .gate { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(7, 8, 15, 0.82); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); animation: fadein 0.25s var(--ease) both; }
  .gate .card { max-width: 440px; width: 100%; display: grid; gap: 14px; animation: pop 0.45s var(--spring) both; }
  .gate h2 { margin: 0; font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; color: #ffd166; text-wrap: balance; }
  .gate p, .gate li { margin: 0; color: var(--muted); font-size: 0.95rem; }
  .gate ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
  .gate .acts { display: flex; gap: 10px; flex-wrap: wrap; }
  .gate .acts .play { flex: 1; width: auto; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    .fx { animation: none; }
  }
</style>
</head>
<body>

<div id="root" class="app">
  <header class="fx">
    <h1>Tinnitus App</h1>
    <p>Loading the tuner…</p>
  </header>
</div>

<script type="module">
import React from "https://cdn.jsdelivr.net/npm/react@19.1.0/+esm";
import { createRoot } from "https://cdn.jsdelivr.net/npm/react-dom@19.1.0/client/+esm";
import htm from "https://cdn.jsdelivr.net/npm/htm@3.1.1/+esm";
import * as Slider from "https://cdn.jsdelivr.net/npm/@radix-ui/react-slider@1.3.5/+esm";
import * as ToggleGroup from "https://cdn.jsdelivr.net/npm/@radix-ui/react-toggle-group@1.1.10/+esm";

const html = htm.bind(React.createElement);
const { useState, useEffect, useRef, useCallback } = React;

/* ---------- Frequency maths ---------- */
const FMIN = 1, FMAX = 22000, STEPS = 2000, LOG_RANGE = Math.log(FMAX / FMIN);
const HEAR_LO = 20, HEAR_HI = 20000; // nominal limits of human hearing
const RMIN = 0.2, RMAX = 40, RSTEPS = 400, RLOG = Math.log(RMAX / RMIN); // pulse rate, Hz
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const sliderToFreq = (v) => FMIN * Math.exp(LOG_RANGE * v / STEPS);
const freqToSlider = (f) => Math.round(STEPS * Math.log(f / FMIN) / LOG_RANGE);
const pos = (f) => Math.log(f / FMIN) / LOG_RANGE; // 0..1
const sliderToRate = (v) => RMIN * Math.exp(RLOG * v / RSTEPS);
const rateToSlider = (r) => Math.round(RSTEPS * Math.log(r / RMIN) / RLOG);
const NAMES = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];
function noteName(f) {
  if (f < HEAR_LO) return "infrasound · below hearing";
  if (f > HEAR_HI) return "ultrasound · above hearing";
  const n = 12 * Math.log(f / 440) / Math.LN2 + 69;
  const r = Math.round(n), cents = Math.round((n - r) * 100);
  return `≈ ${NAMES[((r % 12) + 12) % 12]}${Math.floor(r / 12) - 1} ${cents >= 0 ? "+" : "−"}${Math.abs(cents)}¢`;
}
const fmtHz = (f) => f < 10 ? f.toFixed(2) : f < 100 ? f.toFixed(1) : Math.round(f).toLocaleString("en-US");
const fmtRate = (r) => r < 1 ? r.toFixed(2) : r < 10 ? r.toFixed(1) : String(Math.round(r));
const TICKS = [1, 20, 100, 500, 2000, 8000, 20000];
const tickLabel = (f) => f >= 1000 ? f / 1000 + "k" : String(f);
const MODES = [["off", "Off"], ["both", "On/off"], ["alt", "L ↔ R"], ["left", "Left"], ["right", "Right"]];
const modeAllowed = (m, ear) => ear === 0 || m === "off" || m === "both";
const hueOf = (f) => 315 - (315 - 185) * pos(f); // magenta (low) → cyan (high)

/* ---------- Storage (per device) ---------- */
const KEY = "tinnitus-pitch-match";
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (!s || typeof s.freq !== "number") return null;
    const ear = [-1, 0, 1].includes(s.ear) ? s.ear : 0;
    let mode = MODES.some(([k]) => k === s.mode) ? s.mode : (s.pulse ? "both" : "off");
    if (!modeAllowed(mode, ear)) mode = "both";
    return {
      freq: clamp(s.freq, FMIN, FMAX), vol: clamp(s.vol | 0, 0, 100), ear,
      wave: s.wave === "hiss" ? "hiss" : "tone", mode,
      rate: typeof s.rate === "number" ? clamp(s.rate, RMIN, RMAX) : 1,
      ack: !!s.ack, matches: Array.isArray(s.matches) ? s.matches.slice(0, 8) : []
    };
  } catch (e) { return null; }
}
function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }

/* ---------- Audio engine (imperative, outside React) ----------
   source → master gain → gainL ─┐
                       └→ gainR ─┴→ merger → analyser → out
   Pulsing is a square-wave LFO added to gainL/gainR, so it is sample-accurate at any rate. */
const engine = {
  ctx: null, gain: null, gainL: null, gainR: null, analyser: null, osc: null, noise: null, filter: null,
  lfo: null, lfoNodes: [], pulseT0: 0, modL: false, modR: false, wakeLock: null, playing: false,
  state: { freq: 6000, vol: 20, ear: 0, wave: "tone", mode: "off", rate: 1 },
  ensure() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();
    this.gain = this.ctx.createGain(); this.gain.gain.value = 0;
    this.gainL = this.ctx.createGain(); this.gainR = this.ctx.createGain();

    this.analyser = this.ctx.createAnalyser(); this.analyser.fftSize = 1024; this.analyser.smoothingTimeConstant = 0.6;

  buildSource() {

      const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);

  teardownSource() {

  },
  targetGain() { const v = this.state.vol / 100; return v * v * (this.state.wave === "hiss" ? 2.5 : 0.5); },

  applyPulse() {

    this.modR = !!baseR && (m === "both" || m === "alt" || m === "right");
    this.gainL.gain.setTargetAtTime(this.modL ? 0.5 : baseL, t, 0.01);
    this.gainR.gain.setTargetAtTime(this.modR ? 0.5 : baseR, t, 0.01);

  },
  /* Which side is lit right now, 0 or 1 per channel, in step with the audio LFO. */
  lights() {

    const baseL = s.ear <= 0 ? 1 : 0, baseR = s.ear >= 0 ? 1 : 0;

  },
  start() {
    this.ensure();
    const go = () => { this.buildSource(); this.playing = true; this.apply({}); this.applyPulse(); this.wake(); };
    if (this.ctx.state === "suspended") this.ctx.resume().then(go, go); else go();
  },
  stop() {
    this.playing = false; this.apply({}); this.applyPulse();

  wake() {

  level(buf) {

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && engine.playing && engine.ctx) {
    if (engine.ctx.state === "suspended") engine.ctx.resume();
    engine.wake();
  }
});

/* ---------- Neon bubble ---------- */
function Orb({ freq, playing, burstRef }) {
  const canvasRef = useRef(null);
  const propsRef = useRef({ freq, playing });
  propsRef.current = { freq, playing };
  useEffect(() => {
    const canvas = canvasRef.current, ctx = canvas.getContext("2d");
    const buf = new Float32Array(1024);
    const particles = [];
    let raf, amp = 0, t0 = performance.now(), size = 0, dpr = 1;
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const resize = () => {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      size = canvas.clientWidth; canvas.width = size * dpr; canvas.height = size * dpr;
    };
    resize();
    const ro = new ResizeObserver(resize); ro.observe(canvas);
    burstRef.current = () => {
      if (reduced) return;
      for (let i = 0; i < 90; i++) {
        const a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 4.5;
        particles.push({ x: 0, y: 0, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, hue: Math.random() < 0.5 ? 185 : 315, r: 1 + Math.random() * 2.5 });
      }
    };
    const draw = (now) => {
      const { freq, playing } = propsRef.current;
      const t = (now - t0) / 1000;
      const p = pos(freq);
      const lit = engine.lights();
      const gate = playing ? Math.max(lit.L, lit.R) : 0;
      const target = playing ? clamp(engine.level(buf) * 5, 0.12, 1) * (0.35 + 0.65 * gate) : 0;
      amp += (target - amp) * 0.18;
      const hue = hueOf(freq);
      const ripples = Math.round(3 + 9 * p);
      const cx = size / 2, cy = size / 2, R = size * 0.19;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, size, size);

      ctx.globalCompositeOperation = "lighter";
      const halo = ctx.createRadialGradient(cx, cy, R * 0.6, cx, cy, R * (2.2 + amp * 0.6));
      halo.addColorStop(0, `hsla(${hue}, 100%, 65%, ${0.28 + amp * 0.35})`);
      halo.addColorStop(0.5, `hsla(${hue + 40}, 100%, 60%, ${0.08 + amp * 0.12})`);
      halo.addColorStop(1, "hsla(0,0%,0%,0)");
      ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(cx, cy, R * 3, 0, Math.PI * 2); ctx.fill();

      const N = 120, pts = [];
      const speed = reduced ? 0 : 1;
      for (let i = 0; i < N; i++) {
        const a = (i / N) * Math.PI * 2;
        const wob = 0.05 * Math.sin(3 * a + t * 0.9 * speed) + 0.035 * Math.sin(5 * a - t * 1.3 * speed) + 0.025 * Math.sin(7 * a + t * 0.6 * speed);
        const rip = amp * 0.16 * Math.sin(ripples * a + t * (6 + 10 * amp) * speed);
        const breathe = 0.03 * Math.sin(t * 1.6 * speed);
        const r = R * (1 + breathe + wob + rip + amp * 0.12);
        pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
      }
      const path = () => {
        ctx.beginPath();
        for (let i = 0; i < N; i++) {
          const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % N];
          const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
          if (i === 0) ctx.moveTo(mx, my); else ctx.quadraticCurveTo(x1, y1, mx, my);
        }
        ctx.closePath();
      };
      for (let k = 3; k >= 1; k--) {
        path(); ctx.lineWidth = k * 6; ctx.strokeStyle = `hsla(${hue}, 100%, 60%, ${0.06 + amp * 0.05})`; ctx.stroke();
      }
      ctx.globalCompositeOperation = "source-over";
      const body = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.35, R * 0.1, cx, cy, R * 1.25);
      body.addColorStop(0, `hsla(${hue + 20}, 100%, 78%, 0.55)`);
      body.addColorStop(0.55, `hsla(${hue}, 95%, 55%, 0.35)`);
      body.addColorStop(1, `hsla(${hue - 30}, 90%, 40%, 0.15)`);
      path(); ctx.fillStyle = body; ctx.fill();
      ctx.shadowColor = `hsla(${hue}, 100%, 65%, 0.9)`; ctx.shadowBlur = 24 + amp * 30;
      ctx.lineWidth = 2; ctx.strokeStyle = `hsla(${hue}, 100%, 82%, 0.95)`; ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalCompositeOperation = "lighter";
      const hi = ctx.createRadialGradient(cx - R * 0.45, cy - R * 0.5, 0, cx - R * 0.45, cy - R * 0.5, R * 0.7);
      hi.addColorStop(0, "rgba(255,255,255,0.35)"); hi.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = hi; ctx.beginPath(); ctx.arc(cx - R * 0.45, cy - R * 0.5, R * 0.7, 0, Math.PI * 2); ctx.fill();
      if (playing && !reduced) {
        for (let i = 0; i < 6; i++) {
          const a = t * (0.4 + i * 0.13) + i * 1.05, rr = R * (1.55 + 0.25 * Math.sin(t * 1.1 + i));
          ctx.fillStyle = `hsla(${hue + (i % 2 ? 90 : 0)}, 100%, 75%, ${0.35 + amp * 0.5})`;
          ctx.beginPath(); ctx.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, 1.5 + amp * 2, 0, Math.PI * 2); ctx.fill();
        }
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        const q = particles[i];
        q.x += q.vx; q.y += q.vy; q.vx *= 0.975; q.vy *= 0.975; q.life -= 0.016;
        if (q.life <= 0) { particles.splice(i, 1); continue; }
        ctx.fillStyle = `hsla(${q.hue}, 100%, 70%, ${q.life})`;
        ctx.beginPath(); ctx.arc(cx + q.x, cy + q.y, q.r * q.life + 0.5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";
      raf = requestAnimationFrame(draw);
    };
    raf = requestAnimationFrame(draw);
    return () => { cancelAnimationFrame(raf); ro.disconnect(); };
  }, []);
  return html`<canvas ref=${canvasRef} aria-hidden="true"></canvas>`;
}

/* ---------- Pulse rate slider (shared by panel and light room) ---------- */
function RateControl({ rate, setRate }) {
  return html`
    <div class="rate">
      <div class="row"><span class="lbl">Pulse rate<b>${fmtRate(rate)} Hz</b></span><span class="lbl">${rate < 1 ? "every " + (1 / rate).toFixed(1) + " s" : rate >= 30 ? "gamma flicker" : rate >= 8 ? "fast flicker" : "per second"}</span></div>
      <${Slider.Root} class="SliderRoot vol" value=${[rateToSlider(rate)]} min=${0} max=${RSTEPS} step=${1} onValueChange=${(v) => setRate(sliderToRate(v[0]))} aria-label="Pulse rate">
        <${Slider.Track} class="SliderTrack"><${Slider.Range} class="SliderRange" /><//>
        <${Slider.Thumb} class="SliderThumb" aria-label="Pulse rate in hertz" />
      <//>
      <div class="rate-chips">
        ${[0.5, 1, 2, 4, 10, 40].map((r) => html`<button key=${r} type="button" class="chip" onClick=${() => setRate(r)}>${fmtRate(r)}</button>`)}
      </div>
    </div>`;
}

/* ---------- Full-screen light room ---------- */
function LightRoom({ freq, ear, mode, rate, playing, toggle, setRate, onClose }) {
  const rootRef = useRef(null), canvasRef = useRef(null);
  const propsRef = useRef({ freq, ear, mode, rate, playing });
  propsRef.current = { freq, ear, mode, rate, playing };
  const [ui, setUi] = useState(true);
  const hideTimer = useRef(null);
  const poke = useCallback(() => {
    setUi(true);
    clearTimeout(hideTimer.current);
    hideTimer.current = setTimeout(() => setUi(false), 3500);
  }, []);

  useEffect(() => {
    poke();
    const el = rootRef.current;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    const onFs = () => { if (!document.fullscreenElement) onClose(); };
    document.addEventListener("keydown", onKey);
    document.addEventListener("fullscreenchange", onFs);
    return () => {
      clearTimeout(hideTimer.current);
      document.removeEventListener("keydown", onKey);
      document.removeEventListener("fullscreenchange", onFs);
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    };
  }, []);

  useEffect(() => {
    const canvas = canvasRef.current, ctx = canvas.getContext("2d");
    let raf, w = 0, h = 0, dpr = 1, lL = 0, lR = 0, t0 = performance.now();
    const resize = () => { dpr = Math.min(2, window.devicePixelRatio || 1); w = canvas.clientWidth; h = canvas.clientHeight; canvas.width = w * dpr; canvas.height = h * dpr; };
    resize();
    const ro = new ResizeObserver(resize); ro.observe(canvas);
    const panel = (x, width, hue, I, t, side) => {
      if (I < 0.01) return;
      const cx = x + width * (0.5 + 0.08 * Math.sin(t * 0.35 + side)), cy = h * (0.5 + 0.08 * Math.cos(t * 0.28 + side));
      const rad = Math.hypot(width, h) * 0.75;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
      g.addColorStop(0, `hsla(${hue}, 100%, 96%, ${I})`);
      g.addColorStop(0.3, `hsla(${hue}, 100%, 72%, ${I})`);
      g.addColorStop(0.75, `hsla(${hue}, 100%, 55%, ${I})`);
      g.addColorStop(1, `hsla(${(hue + 40) % 360}, 100%, 45%, ${I})`);
      ctx.fillStyle = g; ctx.fillRect(x, 0, width, h);
      ctx.globalCompositeOperation = "lighter";
      const bloom = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad * 0.45);
      bloom.addColorStop(0, `rgba(255,255,255,${0.55 * I})`); bloom.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = bloom; ctx.fillRect(x, 0, width, h);
      ctx.globalCompositeOperation = "source-over";
    };
    const draw = (now) => {
      const { freq, ear, mode, playing } = propsRef.current;
      const t = (now - t0) / 1000;
      const lit = engine.lights();
      const steady = playing && mode === "off";
      const breathe = 0.8 + 0.2 * Math.sin(t * 1.4);
      const tL = steady ? lit.L * breathe : lit.L, tR = steady ? lit.R * breathe : lit.R;
      lL += (tL - lL) * (tL > lL ? 0.7 : 0.45);
      lR += (tR - lR) * (tR > lR ? 0.7 : 0.45);
      const hue = hueOf(freq), hueR = (hue + 150) % 360;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, w, h);
      if (ear === 0) { panel(0, w / 2, hue, lL, t, 0); panel(w / 2, w / 2, hueR, lR, t, 2); }
      else if (ear < 0) panel(0, w, hue, lL, t, 0);
      else panel(0, w, hueR, lR, t, 2);
      raf = requestAnimationFrame(draw);
    };
    raf = requestAnimationFrame(draw);
    return () => { cancelAnimationFrame(raf); ro.disconnect(); };
  }, []);

  return html`
    <div class="light ${ui ? "" : "hide"}" ref=${rootRef} onPointerMove=${poke} onPointerDown=${poke} role="dialog" aria-label="Light therapy">
      <canvas ref=${canvasRef} aria-hidden="true"></canvas>
      <div class="tip">${playing ? (mode === "off" ? "steady light · set a pulse mode for flashing" : ear === 0 ? "left and right follow each ear" : "light follows your " + (ear < 0 ? "left" : "right") + " ear") : "press play to light up"} · esc to exit</div>
      <div class="bar">
        <div class="top">
          <span class="hzmini">${fmtHz(freq)}<small>HZ</small></span>
          <div class="acts">
            <button type="button" class="play ${playing ? "on" : ""}" onClick=${toggle}>${playing ? "Stop" : "Play"}</button>
            <button type="button" class="ghost" onClick=${onClose}>Exit</button>
          </div>
        </div>
        <${RateControl} rate=${rate} setRate=${setRate} />
      </div>
    </div>`;
}

/* ---------- App ---------- */
function App() {
  const saved = useRef(load()).current;
  const [freq, setFreqState] = useState(saved ? saved.freq : 6000);
  const [vol, setVol] = useState(saved ? saved.vol : 20);
  const [ear, setEarState] = useState(saved ? saved.ear : 0);
  const [wave, setWave] = useState(saved ? saved.wave : "tone");
  const [mode, setMode] = useState(saved ? saved.mode : "off");
  const [rate, setRateState] = useState(saved ? saved.rate : 1);
  const [ack, setAck] = useState(saved ? saved.ack : false);
  const [matches, setMatches] = useState(saved ? saved.matches : []);
  const [playing, setPlaying] = useState(false);
  const [bump, setBump] = useState(false);
  const [toast, setToast] = useState(null);
  const [room, setRoom] = useState(false);
  const [gate, setGate] = useState(false);
  const burstRef = useRef(() => {});

  useEffect(() => { engine.apply({ freq, vol, ear, wave, mode, rate }); save({ freq, vol, ear, wave, mode, rate, ack, matches }); }, [freq, vol, ear, wave, mode, rate, ack, matches]);
  useEffect(() => { setBump(true); const id = setTimeout(() => setBump(false), 160); return () => clearTimeout(id); }, [freq]);
  useEffect(() => {
    const onKey = (e) => {
      if (e.code === "Space" && !room && !gate && !/INPUT|BUTTON|SPAN/.test(document.activeElement?.tagName || "") && !document.activeElement?.getAttribute("role")) {
        e.preventDefault(); toggle();
      }
    };
    document.addEventListener("keydown", onKey); return () => document.removeEventListener("keydown", onKey);
  });

  const setFreq = useCallback((f) => setFreqState(clamp(f, FMIN, FMAX)), []);
  const setRate = useCallback((r) => setRateState(clamp(r, RMIN, RMAX)), []);
  const setEar = (e) => { setEarState(e); if (!modeAllowed(mode, e)) setMode("both"); };
  const toggle = () => { if (engine.playing) { engine.stop(); setPlaying(false); } else { engine.start(); setPlaying(true); } };
  const nudge = (step) => {
    const s = Math.abs(step);
    const base = s >= 10 ? Math.round(freq / s) * s : Math.round(freq);
    setFreq(base + step);
  };
  const lockIn = () => {
    burstRef.current();
    try { navigator.vibrate && navigator.vibrate([20, 30, 40]); } catch (e) {}
    const m = { f: Math.round(freq * 10) / 10, wave, ear, at: Date.now() };
    setMatches([m, ...matches.filter((x) => Math.abs(x.f - m.f) > 0.5)].slice(0, 8));
    setToast({ id: Date.now(), text: `Locked in. ${fmtHz(freq)} Hz is yours.` });
  };
  useEffect(() => { if (!toast) return; const id = setTimeout(() => setToast(null), 2700); return () => clearTimeout(id); }, [toast]);
  const earName = (e) => e < 0 ? "left" : e > 0 ? "right" : "both";

  const openRoom = () => { if (!ack) { setGate(true); return; } if (!engine.playing) { engine.start(); setPlaying(true); } setRoom(true); };
  const acceptGate = () => { setAck(true); setGate(false); if (!engine.playing) { engine.start(); setPlaying(true); } setRoom(true); };
  const orbKey = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openRoom(); } };

  return html`
    <header class="fx">
      <h1>Tinnitus App</h1>

    </header>

    <section class="stage fx" aria-label="Frequency readout">

        <${Orb} freq=${freq} playing=${playing} burstRef=${burstRef} />
        <div class="state ${playing ? "on" : ""}"><i></i>${playing ? "playing" : "silent"}</div>
        <div class="readout" aria-live="polite">
          <div class="hz ${bump ? "bump" : ""}">${fmtHz(freq)}<small>HERTZ</small></div>
          <div class="note">${noteName(freq)}</div>
        </div>
      </div>
    </section>
    <div class="hint fx">Tap the orb for full-screen light therapy</div>

    <section class="panel fx" aria-label="Tone controls">
      <div class="field">
        <div class="row"><span class="lbl">Frequency</span><span class="lbl">1 Hz – 22 kHz</span></div>
        <${Slider.Root} class="SliderRoot" value=${[freqToSlider(freq)]} min=${0} max=${STEPS} step=${1}
          onValueChange=${(v) => setFreq(sliderToFreq(v[0]))} aria-label="Frequency">
          <${Slider.Track} class="SliderTrack">
            <span class="band" style=${{ left: (pos(HEAR_LO) * 100) + "%", width: ((pos(HEAR_HI) - pos(HEAR_LO)) * 100) + "%" }} aria-hidden="true"></span>
            <${Slider.Range} class="SliderRange" />
          <//>
          <${Slider.Thumb} class="SliderThumb" aria-label="Frequency in hertz" />
        <//>
        <div class="ticks" aria-hidden="true">
          ${TICKS.map((f, i) => html`<span key=${f} class=${f === HEAR_LO || f === HEAR_HI ? "edge" : i % 2 === 1 ? "opt" : ""} style=${{ left: (pos(f) * 100) + "%" }}>${tickLabel(f)}</span>`)}
        </div>
        <div class="zones" aria-hidden="true"><span>infrasound</span><span class="mid">audible 20 Hz – 20 kHz</span><span>ultrasound</span></div>
      </div>

      <div class="chips" aria-label="Fine tune">
        ${[-100, -10, -1, 1, 10, 100].map((s) => html`<button key=${s} type="button" class="chip" onClick=${() => nudge(s)} title=${(s > 0 ? "Up " : "Down ") + Math.abs(s) + " Hz"}>${s > 0 ? "+" : "−"}${Math.abs(s)}</button>`)}
      </div>

      <button type="button" class="play ${playing ? "on" : ""}" onClick=${toggle}>
        ${playing
          ? html`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg><span>Stop</span>`
          : html`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg><span>Play tone</span>`}
      </button>

      <div class="controls">
        <div class="field">
          <span class="lbl">Volume<b>${vol}</b></span>
          <${Slider.Root} class="SliderRoot vol" value=${[vol]} min=${0} max=${100} step=${1} onValueChange=${(v) => setVol(v[0])} aria-label="Volume">
            <${Slider.Track} class="SliderTrack"><${Slider.Range} class="SliderRange" /><//>
            <${Slider.Thumb} class="SliderThumb" aria-label="Volume" />
          <//>
        </div>
        <div class="field">
          <span class="lbl" id="earLbl">Ear</span>
          <${ToggleGroup.Root} class="ToggleGroup" type="single" value=${String(ear)} onValueChange=${(v) => { if (v) setEar(Number(v)); }} aria-labelledby="earLbl">
            <${ToggleGroup.Item} class="ToggleGroupItem" value="-1">Left<//>
            <${ToggleGroup.Item} class="ToggleGroupItem" value="0">Both<//>
            <${ToggleGroup.Item} class="ToggleGroupItem" value="1">Right<//>
          <//>
        </div>
        <div class="field">
          <span class="lbl" id="waveLbl">Sound</span>
          <${ToggleGroup.Root} class="ToggleGroup" type="single" value=${wave} onValueChange=${(v) => { if (v) setWave(v); }} aria-labelledby="waveLbl">
            <${ToggleGroup.Item} class="ToggleGroupItem" value="tone">Pure tone<//>
            <${ToggleGroup.Item} class="ToggleGroupItem" value="hiss">Narrow hiss<//>
          <//>
        </div>
        <div class="field">
          <span class="lbl" id="modeLbl">Pulse${ear !== 0 ? html`<b>${earName(ear)} ear only</b>` : null}</span>
          <${ToggleGroup.Root} class="ToggleGroup five" type="single" value=${mode} onValueChange=${(v) => { if (v) setMode(v); }} aria-labelledby="modeLbl">
            ${MODES.map(([k, label]) => html`<${ToggleGroup.Item} key=${k} class="ToggleGroupItem" value=${k} disabled=${!modeAllowed(k, ear)}>${label}<//>`)}
          <//>
        </div>
        <div class="field wide">
          <${RateControl} rate=${rate} setRate=${setRate} />
        </div>
      </div>

      <button type="button" class="ghost" onClick=${openRoom}>Open full-screen light therapy</button>
      <button type="button" class="lock" onClick=${lockIn} disabled=${!playing}>${playing ? "That's it. Lock it in" : "Play a tone to lock it in"}</button>

      ${matches.length ? html`
        <div class="field">
          <span class="lbl">Your matches</span>
          <div class="matches">
            ${matches.map((m) => html`
              <div class="match" key=${m.at}>
                <div><b>${fmtHz(m.f)} Hz</b><br /><small>${m.wave === "hiss" ? "hiss" : "tone"} · ${earName(m.ear)} · ${new Date(m.at).toLocaleDateString()}</small></div>
                <div class="acts">
                  <button type="button" class="mini" onClick=${() => { setFreq(m.f); setWave(m.wave); setEar(m.ear); }}>Recall</button>
                  <button type="button" class="mini" onClick=${() => setMatches(matches.filter((x) => x.at !== m.at))} aria-label="Remove match">✕</button>
                </div>
              </div>`)}
          </div>
        </div>` : null}

      <p class="warn"><b>Keep it quiet.</b> Loud tones can worsen tinnitus. Match at the lowest level you can clearly hear and stop if it feels uncomfortable.</p>
    </section>

    <div class="foot fx">
      <p>Logarithmic scale across the whole range a sound card can produce, with the audible band highlighted. Most tinnitus sits between 4 and 8 kHz. Outside 20 Hz to 20 kHz the tone still plays, but you will feel or see it more than hear it. Playback runs until you press Stop, and your settings and matches stay on this device.</p>
    </div>

    ${gate ? html`
      <div class="gate" role="alertdialog" aria-labelledby="gateTitle">
        <div class="panel card">
          <h2 id="gateTitle">Flashing lights ahead</h2>
          <p>The light room fills the screen with very bright colour that flashes in step with the tone, up to 40 times a second.</p>
          <ul>
            <li>Do not use it if you have photosensitive epilepsy or a history of seizures.</li>
            <li>Turn the screen brightness up and close your eyes. The light comes through your eyelids.</li>
            <li>Stop at once if you feel dizzy, nauseous or unwell.</li>
          </ul>
          <div class="acts">
            <button type="button" class="play" onClick=${acceptGate}>I understand, start</button>
            <button type="button" class="ghost" onClick=${() => setGate(false)}>Back</button>
          </div>
        </div>
      </div>` : null}

    ${room ? html`<${LightRoom} freq=${freq} ear=${ear} mode=${mode} rate=${rate} playing=${playing} toggle=${toggle} setRate=${setRate} onClose=${() => setRoom(false)} />` : null}
    ${toast ? html`<div class="toast" key=${toast.id} role="status">${toast.text}</div>` : null}
  `;
}

createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
